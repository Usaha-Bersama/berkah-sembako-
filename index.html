<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berkah Sembako - Bandung</title>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50">
<header class="bg-white sticky top-0 shadow">
<div class="bg-green-600 text-white text-center py-1 text-sm">Gratis Ongkir Bandung Kota! WA: 081229768081</div>
<div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
<h1 class="font-bold text-xl text-green-700">BERKAH SEMBAKO</h1>
<button onclick="openCart()" class="bg-green-600 text-white px-4 py-2 rounded-full">Keranjang (<span id="cart-count">0</span>)</button>
</div></header>

<div class="max-w-7xl mx-auto px-4 mt-6 grid grid-cols-2 md:grid-cols-4 gap-4" id="products"></div>

<div id="cart-drawer" class="fixed inset-0 hidden"><div class="absolute right-0 top-0 w-80 bg-white h-full p-4 shadow-xl">
<h2 class="font-bold">Keranjang</h2><div id="cart-items" class="mt-4"></div>
<button onclick="checkout()" class="w-full bg-green-600 text-white py-3 rounded-lg mt-4">Checkout WA</button>
<button onclick="closeCart()" class="w-full mt-2">Tutup</button>
</div></div>

<script>
// ===============================
// SETTING ETALASE - EDIT DI SINI AJA BRO!
// ===============================
const products=[
  {id:1, name:"Beras Premium 5kg", price:65000, image:"https://images.unsplash.com/photo-1586201375761-83865001e31c?w=400"},
  {id:2, name:"Minyak Goreng 2L", price:34000, image:"https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=400"},
  {id:3, name:"Gula Pasir 1kg", price:14500, image:"https://images.unsplash.com/photo-1587049352851-8d4e89133924?w=400"},
  {id:4, name:"Telur Ayam 1kg", price:28000, image:"https://images.unsplash.com/photo-1484251063729-29a0a0d8d56d?w=400"},
  {id:5, name:"Tepung Terigu 1kg", price:13000, image:"https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=400"}
];
// Untuk TAMBAH produk baru, copy baris di atas, paste di bawah, ganti id jadi 6, 7, 8 dst
// Untuk GANTI FOTO, ganti link di bagian image:"..."
// Untuk GANTI HARGA, ganti angka di price:...

let cart=JSON.parse(localStorage.getItem('cart')||'[]');
function render(){document.getElementById('products').innerHTML=products.map(p=>`
<div class="bg-white rounded-xl p-3 shadow">
<img src="${p.image}" class="w-full h-32 object-cover rounded-lg">
<h3 class="font-bold mt-2 text-sm">${p.name}</h3>
<p class="text-green-600 font-bold">Rp ${p.price.toLocaleString('id-ID')}</p>
<button onclick="add(${p.id})" class="w-full bg-green-600 text-white py-2 rounded-lg mt-2 text-sm">+ Keranjang</button>
</div>`).join(''); document.getElementById('cart-count').innerText=cart.reduce((a,b)=>a+b.qty,0);}
function add(id){let f=cart.find(x=>x.id===id); if(f) f.qty++; else cart.push({id,qty:1}); save(); render(); openCart();}
function save(){localStorage.setItem('cart',JSON.stringify(cart));}
function openCart(){document.getElementById('cart-drawer').classList.remove('hidden'); let html=''; let total=0; cart.forEach(c=>{let p=products.find(x=>x.id===c.id); total+=p.price*c.qty; html+=`<div class="flex justify-between py-2 border-b"><span>${p.name} x${c.qty}</span><span>Rp ${(p.price*c.qty).toLocaleString()}</span></div>`}); html+=`<div class="font-bold mt-2">Total: Rp ${total.toLocaleString()}</div>`; document.getElementById('cart-items').innerHTML=html;}
function closeCart(){document.getElementById('cart-drawer').classList.add('hidden');}
function checkout(){let total=0; let pesan="Halo Berkah Sembako, saya mau pesan:%0A"; cart.forEach(c=>{let p=products.find(x=>x.id===c.id); total+=p.price*c.qty; pesan+=`- ${p.name} x${c.qty} = Rp ${(p.price*c.qty).toLocaleString()}%0A`}); pesan+=`%0ATotal: Rp ${total.toLocaleString()}%0A`; window.open(`https://wa.me/6281229768081?text=${pesan}`);}
render();
</script></body></html>
