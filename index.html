];

if(p.varianHarga){

} else if(p.varian){

}

function updateHarga(id){
for(var i=0;i<products.length;i++){ if(products[i].id==id){ var p=products[i]; var sel=document.getElementById('varian-'+id); var idx=parseInt(sel.value); var hrg=p.varianHarga[idx].harga; document.getElementById('harga-'+id).innerText='Rp '+hrg.toLocaleString('id-ID'); } }
}
function gantiFoto(id){
for(var i=0;i<products.length;i++){ if(products[i].id==id){ var p=products[i]; var el=document.getElementById('foto-'+id); if(!p.img2) return; if(el.src.indexOf(p.img)>-1){ el.src=p.img2; } else { el.src=p.img; } } }
}
function cari(){var q=document.getElementById('searchInput').value.toLowerCase();var f=[];for(var i=0;i<products.length;i++){ if(products[i].name.toLowerCase().indexOf(q)>-1){ f.push(products[i]); } } render(f);}
function filterKat(kat){if(kat=='all'){render(products);return;}var f=[];for(var i=0;i<products.length;i++){ if(products[i].name.toLowerCase().indexOf(kat.toLowerCase())>-1){ f.push(products[i]); } } render(f);}
function add(id){
var p=null; for(var i=0;i<products.length;i++){ if(products[i].id==id) p=products[i]; }
var namaFinal=p.name;
var hargaFinal=p.price;
var sel=document.getElementById('varian-'+id);
if(p.varianHarga && sel){ var idx=parseInt(sel.value); namaFinal=p.name+' - '+p.varianHarga[idx].nama; hargaFinal=p.varianHarga[idx].harga; }
else if(sel){ namaFinal=p.name+' - '+sel.value; }
var f=null; for(var i=0;i<cart.length;i++){ if(cart[i].namaFinal==namaFinal) f=cart[i]; }
if(f){ f.qty++; } else { cart.push({id:p.id,namaFinal:namaFinal,name:namaFinal,price:hargaFinal,img:p.img,qty:1}); }
save();
}
function save(){localStorage.setItem('c',JSON.stringify(cart));update();}
function update(){var jml=0;var total=0;for(var i=0;i<cart.length;i++){ jml+=cart[i].qty; total+=cart[i].price*cart[i].qty; } document.getElementById('cart-count').innerText=jml; document.getElementById('cart-total').innerText='Rp '+total.toLocaleString('id-ID'); var h=""; for(var i=0;i<cart.length;i++){ var c=cart[i]; h+='<div class="flex gap-2 border-b py-2"><img src="'+c.img+'" class="w-12 h-12 rounded"><div class="flex-1"><p class="text-sm font-bold">'+c.name+'</p><p class="text-xs text-blue-600">Rp '+c.price.toLocaleString('id-ID')+' x '+c.qty+'</p><div class="flex gap-2 mt-1"><button onclick="chg('+i+',-1)" class="border w-6 h-6 rounded-full">-</button><span class="text-sm">'+c.qty+'</span><button onclick="chg('+i+',1)" class="border w-6 h-6 rounded-full">+</button></div></div><button onclick="del('+i+')" class="text-gray-300">X</button></div>'; } if(h=="") h='<p class="text-center text-gray-400 mt-10">Kosong</p>'; document.getElementById('cart-items').innerHTML=h;}
function chg(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);save();}
function del(i){cart.splice(i,1);save();}
function openCart(){document.getElementById('cart-drawer').classList.remove('hidden');}
