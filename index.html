<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Toko Berkah Sembako - WA 081229768081</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head>
<body class="bg-gray-50">
<header class="bg-white sticky top-0 z-50 shadow">
<div class="bg-green-600 text-white text-center text-sm py-1">Gratis Ongkir Cikarang! WA 081229768081</div>
<div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
<div class="flex gap-2 items-center"><div class="bg-green-600 w-10 h-10 rounded-lg flex items-center justify-center text-white font-bold">B</div><div><h1 class="font-bold">Berkah Sembako</h1><p class="text-xs text-gray-500">WA: 081229768081</p></div></div>
<button onclick="openCart()" class="bg-green-50 text-green-600 px-4 py-2 rounded-full text-sm font-bold"><i class="fa fa-shopping-cart"></i> Keranjang <span id="cart-count" class="bg-red-500 text-white text-xs px-1.5 rounded-full">0</span></button>
</div></header>
<div class="max-w-7xl mx-auto px-4 mt-4 bg-gradient-to-r from-green-600 to-yellow-500 rounded-2xl p-6 text-white"><h2 class="text-2xl font-bold">Berkah Sembako - Pesan Langsung WA</h2><p class="text-sm mt-1">Checkout otomatis ke WA 081229768081</p></div>
<div class="max-w-7xl mx-auto px-4 mt-4 grid grid-cols-2 md:grid-cols-4 gap-3" id="produk"></div>
<div id="cart-drawer" class="fixed inset-0 bg-black/50 hidden z-50"><div class="absolute right-0 top-0 h-full w-full max-w-sm bg-white flex flex-col"><div class="p-4 border-b flex justify-between"><b>Keranjang</b><button onclick="closeCart()" class="bg-gray-100 w-8 h-8 rounded-full"><i class="fa fa-times"></i></button></div><div id="cart-items" class="flex-1 overflow-auto p-4"></div><div class="p-4 border-t"><div class="flex justify-between font-bold mb-3"><span>Total</span><span id="cart-total">Rp 0</span></div><button onclick="checkoutWA()" class="w-full bg-green-600 text-white py-3 rounded-full font-bold"><i class="fab fa-whatsapp"></i> Checkout ke 081229768081</button></div></div></div>
<script>
const products=[{id:1,name:"Beras Premium 5kg",price:67500,img:"https://images.unsplash.com/photo-1586201375761-83865001e31c?w=400"},{id:2,name:"Beras Medium 5kg",price:59000,img:"https://images.unsplash.com/photo-1536304929831-ee1ca9d44906?w=400"},{id:3,name:"Minyak Tropical 2L",price:32500,img:"https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=400"},{id:4,name:"Minyak Kita 1L",price:15700,img:"https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=400"},{id:5,name:"Gula Pasir 1kg",price:15500,img:"https://images.unsplash.com/photo-1581441363689-1f3c3c414635?w=400"},{id:6,name:"Tepung Segitiga 1kg",price:12500,img:"https://images.unsplash.com/photo-1509440159596-0249088772ff?w=400"},{id:7,name:"Telur Ayam 1kg",price:29500,img:"https://images.unsplash.com/photo-1518569656558-1f25e69e163d?w=400"},{id:8,name:"Indomie Goreng 1 Dus",price:112000,img:"https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=400"},{id:9,name:"Molto 1 Renteng",price:6000,img:"f1.jpg"}];
let cart=JSON.parse(localStorage.getItem('c')||'[]');
function render(){document.getElementById('produk').innerHTML=products.map(p=>`<div class="bg-white rounded-xl overflow-hidden border"><img src="${p.img}" class="w-full h-36 object-cover"><div class="p-2"><h3 class="text-sm font-bold">${p.name}</h3><p class="text-green-600 font-bold text-sm">Rp ${p.price.toLocaleString('id-ID')}</p><button onclick="add(${p.id})" class="mt-2 w-full bg-green-600 text-white py-1.5 rounded-full text-sm">+ Tambah</button></div></div>`).join('');update();}
function add(id){let f=cart.find(x=>x.id===id);let p=products.find(x=>x.id===id);if(f)f.qty++;else cart.push({...p,qty:1});save();}
function save(){localStorage.setItem('c',JSON.stringify(cart));update();}
function update(){document.getElementById('cart-count').innerText=cart.reduce((a,b)=>a+b.qty,0);let total=cart.reduce((a,b)=>a+b.price*b.qty,0);document.getElementById('cart-total').innerText='Rp '+total.toLocaleString('id-ID');document.getElementById('cart-items').innerHTML=cart.map((c,i)=>`<div class="flex gap-2 border-b py-2"><img src="${c.img}" class="w-12 h-12 rounded"><div class="flex-1"><p class="text-sm font-bold">${c.name}</p><p class="text-xs text-green-600">Rp ${c.price.toLocaleString('id-ID')} x ${c.qty}</p><div class="flex gap-2 mt-1"><button onclick="chg(${i},-1)" class="border w-6 h-6 rounded-full">-</button><span class="text-sm">${c.qty}</span><button onclick="chg(${i},1)" class="border w-6 h-6 rounded-full">+</button></div></div><button onclick="del(${i})" class="text-gray-300"><i class="fa fa-trash"></i></button></div>`).join('')||'<p class="text-center text-gray-400 mt-10">Kosong</p>';}
function chg(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);save();}
function del(i){cart.splice(i,1);save();}
function openCart(){document.getElementById('cart-drawer').classList.remove('hidden');}
function closeCart(){document.getElementById('cart-drawer').classList.add('hidden');}
function checkoutWA(){if(!cart.length)return;let total=cart.reduce((a,b)=>a+b.price*b.qty,0);let msg=`Halo Berkah Sembako%0ASaya mau pesan:%0A`;cart.forEach(c=>{msg+=`- ${c.name} x${c.qty} = Rp ${(c.price*c.qty).toLocaleString('id-ID')}%0A`});msg+=`%0ATotal: Rp ${total.toLocaleString('id-ID')}%0AAlamat:%0A`;window.open('https://wa.me/6281229768081?text='+msg,'_blank');}
render();
</script></body></html>
